name: Build CI
on: [push, pull_request]
jobs:
  build:
    name: Java ${{ matrix.java }} test build (on ${{ matrix.os }})
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        java: [ 21 ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup java
        uses: actions/setup-java@v4
        with:
          distribution: 'adopt'
          java-version: ${{ matrix.java }}
      - name: Build mod
        run: gradle build
      - name: Package mod
        run: gradle remapJar